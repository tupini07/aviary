# Example GitHub Actions workflow: build a static web app and deploy it to an
# Aviary project on every push to main.
#
# Setup:
#   1. In the Aviary control plane, open the project's API keys view and create
#      a key. Copy the av_... token once.
#   2. Run and commit:
#        aviary project init --url https://console.example.com \
#          --project my-web-app --dir dist
#   3. In the GitHub repo: Settings -> Secrets and variables -> Actions, add a
#      secret named AVIARY_KEY with that token.
#   4. Adjust the build steps below.
#
# Copy this file to .github/workflows/deploy.yml in your app's repository.

name: Deploy to Aviary

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build
        run: |
          npm ci
          npm run build   # must emit static files into ./dist

      - name: Install Aviary CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/aviary/bin"
          gh release download \
            --repo tupini07/aviary \
            --pattern 'aviary_*_linux_amd64.zip' \
            --dir "$RUNNER_TEMP/aviary"
          archive=$(echo "$RUNNER_TEMP"/aviary/aviary_*_linux_amd64.zip)
          unzip -q "$archive" -d "$RUNNER_TEMP/aviary/bin"
          echo "$RUNNER_TEMP/aviary/bin" >> "$GITHUB_PATH"

      - name: Deploy to Aviary
        env:
          AVIARY_KEY: ${{ secrets.AVIARY_KEY }}
        run: aviary deploy
